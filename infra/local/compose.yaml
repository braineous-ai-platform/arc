name: arc-local

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./.ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  litellm:
    image: ghcr.io/berriai/litellm:v1.90.2
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DISABLE_ADMIN_UI: "True"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
